global:
  scrape_interval: 5s
  scrape_timeout: 3s
rule_files:
  - /etc/prometheus/alert_rules.yml
scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway-api:8080']
  - job_name: aggregator
    metrics_path: /metrics
    static_configs:
      - targets: ['aggregator:8081']
  - job_name: features
    metrics_path: /metrics
    static_configs:
      - targets: ['features:8082']
  - job_name: alerts
    metrics_path: /metrics
    static_configs:
      - targets: ['alerts:8083']
  - job_name: governance
    metrics_path: /metrics
    static_configs:
      - targets: ['governance:8084']
  - job_name: query
    metrics_path: /metrics
    static_configs:
      - targets: ['query:8085']
  - job_name: inference
    metrics_path: /metrics
    static_configs:
      - targets: ['inference:8090']
  - job_name: simulator
    metrics_path: /metrics
    static_configs:
      - targets: ['simulator:8086']
