groups:
  - name: sentinel.rules
    rules:
      - alert: SentinelServiceDown
        expr: up{job=~"gateway|aggregator|features|alerts|governance|query|inference|simulator"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Sentinel service down
      - alert: InferenceFallbackMode
        expr: inference_fallback_mode > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Inference is running in fallback mode
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Elevated 5xx rate
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, service, route) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API latency p95 exceeded 500ms
