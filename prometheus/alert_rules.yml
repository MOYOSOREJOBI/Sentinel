groups:
  - name: sentinel.ops
    rules:
      - alert: SentinelServiceDown
        expr: up{job=~"gateway|aggregator|features|alerts|governance|query|inference|simulator"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: A Sentinel service is down.
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx rate is elevated.
      - alert: InferenceFallbackModeTrue
        expr: inference_fallback_mode > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Inference is running in fallback mode.
